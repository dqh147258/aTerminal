[package]
name = "ai-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aTerminal"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
serde.workspace = true
ai-terminal-agent-runtime = { path = "../agent-runtime" }
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
portable-pty.workspace = true
ai-terminal-engine.workspace = true
ai-terminal-protocol.workspace = true
ai-terminal-agent.workspace = true
ai-terminal-remote.workspace = true
tokio.workspace = true
serde_json.workspace = true
ai-terminal-security.workspace = true
rpassword = "7"

[lints]
workspace = true

[dev-dependencies]
ai-terminal-server = { path = "../server" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ai-terminal-mobile = { path = "../mobile-core", features = ["webrtc"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
futures-util.workspace = true
