[package]
name = "ai-terminal-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde_yaml = "0.9"
jsonschema = { version = "=0.33.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "=1.26.1", features = ["v7", "serde"] }
base64.workspace = true
chrono = { version = "0.4", features = ["serde"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
blake3.workspace = true
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }

# Share the existing ring provider with Desktop; do not enable two default TLS providers.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[lints]
workspace = true
