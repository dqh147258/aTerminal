[package]
name = "ai-terminal-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["webrtc"]
webrtc = ["ai-terminal-remote/webrtc"]

[dependencies]
serde_yaml = "0.9"
jsonschema = { version = "=0.33.0", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
fontdue = { version = "=0.9.3", default-features = false, features = ["std"] }
png = "=0.18.1"
unicode-width = "0.2"
base64.workspace = true
chrono = "0.4"
ai-terminal-agent-runtime = { path = "../agent-runtime" }
anyhow.workspace = true
ai-terminal-protocol.workspace = true
ai-terminal-engine.workspace = true
portable-pty.workspace = true
getrandom.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"
blake3.workspace = true
ai-terminal-remote.workspace = true
ai-terminal-security.workspace = true
tokio.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
ai-terminal-windows-process = { path = "../windows-process" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8"
tempfile = "3"
