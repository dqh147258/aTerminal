name: Cancel Superseded Linux Release CI
on:
  push:
    branches: [codex/cleanup-linux-server-ci-20261006]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ids = [37407131366,37407127968,37407065216,37407061638];
            const superseded = new Set(["68a621e18525be5f0f48b24b08dfc4873d7503f3","16c95c3cf8f658397ba97996e83da6a35f4caed4"]);
            const branch = 'codex/linux-server-prerelease-20261006';
            for (const run_id of ids) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
              if (run.head_branch !== branch || !superseded.has(run.head_sha) || run.name !== 'Verify Terminal') {
                throw new Error('Refusing to cancel unexpected workflow run ' + run_id);
              }
              if (run.status === 'completed') {
                core.info('Already completed: ' + run_id);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
              core.info('Cancelled superseded run: ' + run_id);
            }
