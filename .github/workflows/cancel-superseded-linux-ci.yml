name: Cancel Superseded Desktop Package Build
on:
  push:
    branches: [codex/cleanup-linux-server-ci-20261006]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const { data: current } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37414110717 });
            const { data: old } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37411053445 });
            if (ref.object.sha !== '1f5453554c79230404deac25b90f757ca9b1af56' ||
                current.head_sha !== ref.object.sha || current.name !== 'Test Packages' ||
                old.head_sha !== 'a8291d2c87939bf5a280bb232ee66991480d24a8' ||
                old.head_branch !== 'main' || old.name !== 'Test Packages') {
              throw new Error('Refusing to cancel an unexpected or current workflow');
            }
            if (old.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: old.id });
              core.info('Cancelled only superseded package run ' + old.id);
            } else {
              core.info('Superseded run was already complete');
            }
