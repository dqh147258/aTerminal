name: Diagnose Windows ACL subprocesses

on:
  push:
    branches: ['codex/test-packages-20261005']
    paths:
      - '.github/workflows/benchmark-windows-acl.yml'
      - 'scripts/benchmark-windows-acl.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Windows ACL startup benchmark
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare isolated subprocess environments
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/benchmark-windows-acl.ps1
