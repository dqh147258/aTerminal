name: Verify Terminal
on:
  push:
    branches-ignore: ['codex/test-packages-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev libdbus-1-dev pkg-config
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --exclude ai-terminal-bindgen
      - run: cargo clippy --locked --workspace --all-targets --exclude ai-terminal-bindgen -- -D warnings
      - if: runner.os != 'Windows'
        run: |
          cargo build --locked -p ai-terminal
          python3 scripts/test-host-terminal.py target/debug/aTerminal
  mobile-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios, aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: python3 scripts/build-mobile.py ios --webrtc
      - run: python3 scripts/build-mobile.py android --webrtc --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - run: python3 scripts/prepare-bindings.py
      - run: python3 scripts/build-ios-probe.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./apps/android/gradlew -p apps/android :app:assembleDebug --no-daemon
  webrtc-loopback:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo test --locked -p ai-terminal-transport --test loopback
      - run: cargo test --locked -p ai-terminal-remote --features webrtc
