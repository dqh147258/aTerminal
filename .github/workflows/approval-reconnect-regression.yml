name: Approval and Reconnect Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-state:
    name: iOS authorization and reconnect state
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-ios-authorization.py
      - run: python3 scripts/check-ios-settings.py
      - run: python3 scripts/check-ios-reconnect.py
      - run: python3 scripts/check-ios-chat-delivery.py

  ios-ui:
    name: iOS conversation and authorization UI
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Build isolated native UI fixtures
        run: |
          python3 scripts/build-mobile.py ios
          python3 scripts/build-mobile.py ios --simulator
          python3 scripts/prepare-bindings.py
          python3 - <<'PY'
          import platform, subprocess
          target = 'aarch64-apple-ios-sim' if platform.machine() == 'arm64' else 'x86_64-apple-ios'
          subprocess.run(['python3', 'scripts/package-ios.py', '--simulator-target', target, '--replace'], check=True)
          PY
      - name: Run native iOS regressions
        run: python3 scripts/run-ios-conversation-ui.py
      - name: Preserve iOS test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-ios-${{ github.sha }}-${{ github.run_attempt }}
          path: build/reconnect-evidence/ios-conversation.xcresult
          if-no-files-found: warn
          retention-days: 14

  android-ui:
    name: Android approval and reconnect UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated native cache and UI fixtures
        run: |
          python3 scripts/build-mobile.py android --android-abi x86_64 --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/prepare-bindings.py
          ./apps/android/gradlew -p apps/android -PauthorizationUiFixture=true :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 scripts/run-android-reconnect-ui.py
      - name: Preserve test results and native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approval-reconnect-android-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
            apps/android/app/build/reports/tests
            build/reconnect-evidence
          if-no-files-found: warn
          retention-days: 14
