name: Verify App Icons
on:
  push:
    paths: ['assets/branding/**', 'apps/android/app/src/main/res/**', 'apps/android/app/src/main/AndroidManifest.xml', 'apps/ios/aTerminal/Assets.xcassets/**', 'apps/ios/aTerminal.xcodeproj/project.pbxproj', 'scripts/*app-icons.py', 'scripts/generate-ios-project.rb', 'scripts/build-ios-probe.py', '.github/workflows/app-icons.yml']
  pull_request:
    paths: ['assets/branding/**', 'apps/android/app/src/main/res/**', 'apps/android/app/src/main/AndroidManifest.xml', 'apps/ios/aTerminal/Assets.xcassets/**', 'apps/ios/aTerminal.xcodeproj/project.pbxproj', 'scripts/*app-icons.py', 'scripts/generate-ios-project.rb', 'scripts/build-ios-probe.py', '.github/workflows/app-icons.yml']
permissions:
  contents: read
jobs:
  ios-assets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/check-app-icons.py
      - name: Compile iPhone and iPad asset catalog
        run: |
          mkdir -p /tmp/aterminal-icons
          xcrun actool apps/ios/aTerminal/Assets.xcassets --compile /tmp/aterminal-icons --platform iphoneos --minimum-deployment-target 15.0 --app-icon AppIcon --target-device iphone --target-device ipad --output-partial-info-plist /tmp/aterminal-icons.plist
          plutil -lint apps/ios/aTerminal.xcodeproj/project.pbxproj
  android-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and link application resources
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT" compile --dir apps/android/app/src/main/res -o /tmp/aterminal-res.zip
          sed 's/<manifest /<manifest package="com.yxf.aterminal" /' apps/android/app/src/main/AndroidManifest.xml > /tmp/AndroidManifest.xml
          "$AAPT" link -o /tmp/aterminal-res.apk -I "$ANDROID_HOME/platforms/android-35/android.jar" --manifest /tmp/AndroidManifest.xml /tmp/aterminal-res.zip
