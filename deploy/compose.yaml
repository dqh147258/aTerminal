services:
  server:
    image: ai-terminal-server:development
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AI_TERMINAL_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets: [admin_token]
    volumes: [server_data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, /usr/local/bin/ai-terminal-server, --healthcheck]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  tls:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your relay hostname}
    ports: ['443:443', '80:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    mem_limit: 96m
    depends_on:
      server: {condition: service_healthy}
secrets:
  admin_token:
    file: ./secrets/admin-token
volumes:
  server_data:
  tls_data:
  tls_config:
