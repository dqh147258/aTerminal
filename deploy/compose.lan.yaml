services:
  server:
    image: ai-terminal-server:development
    restart: unless-stopped
    stop_signal: SIGINT
    ports: ['127.0.0.1:7201:8787']
    environment:
      AI_TERMINAL_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets: [admin_token]
    volumes: [server_data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, /usr/local/bin/ai-terminal-server, --healthcheck]
      interval: 5s
      timeout: 3s
      retries: 3
  lan_tls:
    image: nginx:1.27-alpine
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    restart: unless-stopped
    ports: ['192.168.0.36:7200:7200', '127.0.0.1:7200:7200']
    volumes:
      - ./nginx.lan.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/lan-server.crt:/run/tls/server.crt:ro
      - ./secrets/lan-server.key:/run/tls/server.key:ro
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      server: {condition: service_healthy}
secrets:
  admin_token:
    file: ./secrets/admin-token
volumes:
  server_data:
